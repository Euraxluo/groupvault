[package]
name = "groupvault-test-factory"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Test-only Sputnik factory double for GroupVault Convert tests"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.17.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "=5.17.0", features = ["unit-testing"] }
